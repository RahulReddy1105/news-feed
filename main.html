<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Personalized News Feed</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }
    .header {
      text-align: center;
      background-color: #0078d7;
      color: white;
      padding: 20px;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 300px;
      margin: 15px;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.02);
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .card-content {
      padding: 15px;
    }
    .card h3 {
      margin: 0 0 10px;
    }
    button {
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background-color: #005fa3;
    }
    #recommendations {
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📰 AI Personalized News Feed</h1>
    <p>Like a few articles, then get personalized recommendations!</p>
  </div>

  <div class="container" id="news-container">
    {% for article in articles %}
    <div class="card">
      {% if article.image %}
      <img src="{{ article.image }}" alt="news image">
      {% endif %}
      <div class="card-content">
        <h3>{{ article.title }}</h3>
        <p>{{ article.description }}</p>
        <button onclick="likeArticle(`{{ article.content|escapejs }}`)">👍 Like</button>
      </div>
    </div>
    {% endfor %}
  </div>

  <div id="recommendations">
    <button onclick="getRecommendations()">✨ Get Recommendations</button>
    <div id="recommended-list"></div>
  </div>

  <script>
    async function likeArticle(content) {
      const res = await fetch('/like', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content})
      });
      const data = await res.json();
      alert(data.message);
    }

    async function getRecommendations() {
      const res = await fetch('/recommend');
      const data = await res.json();
      const list = document.getElementById('recommended-list');
      list.innerHTML = "";
      if (data.error) {
        alert(data.error);
        return;
      }
      data.forEach(a => {
        const item = document.createElement('div');
        item.innerHTML = `<h3>${a.title}</h3><p>${a.description}</p><a href="${a.url}" target="_blank">Read more</a><hr>`;
        list.appendChild(item);
      });
    }
  </script>
</body>
</html>
